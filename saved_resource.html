<!DOCTYPE html>
<!-- saved from url=(0012)about:srcdoc -->
<html lang="en" data-theme="mono"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premium Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --accent: #4285f4;
    --accent-glow: #6ad5ff;
    --bg-radial: radial-gradient(circle, #051937, #002034, #002326, #002316, #1a2207);
    --panel: #002327;
    --shadow-dark: #000f10;
    --shadow-light: #00373e;
    --btn-dark: #171717;
    --btn-light: #1c1c1c;
  }
  :root[data-theme="gold"] {
    --accent: #d4af37;
    --accent-glow: #ffe9a8;
    --bg-radial: radial-gradient(circle, #1a1400, #2b2100, #241a00, #180f00, #000);
    --panel: #241c04;
    --shadow-dark: #0d0a00;
    --shadow-light: #4a3a06;
    --btn-dark: #1c1706;
    --btn-light: #241d08;
  }
  :root[data-theme="mono"] {
    --accent: #e0e0e0;
    --accent-glow: #ffffff;
    --bg-radial: radial-gradient(circle, #1a1a1a, #101010, #0a0a0a, #050505, #000);
    --panel: #161616;
    --shadow-dark: #000;
    --shadow-light: #2a2a2a;
    --btn-dark: #151515;
    --btn-light: #1e1e1e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    display:flex; justify-content:center; align-items:center;
    background-image: var(--bg-radial);
    font-family: 'Orbitron', system-ui, sans-serif;
    color:#fff;
    transition: background-image .4s ease;
  }
  .container {
    border: 2px solid #000;
    padding: 20px;
    border-radius: 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    background: var(--panel);
    box-shadow:-6px -6px 10px var(--shadow-dark), 6px 6px 10px var(--shadow-light);
    max-width: 95vw;
    transition: background .4s ease, box-shadow .4s ease;
  }
  .theme-toggle {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 44px;
    height: 28px;
    border-radius: 20px;
    background: transparent;
    box-shadow: none;
    font-size: 16px;
    color: var(--accent);
  }
  .row { display:flex; }
  #inputbox {
    width: 320px;
    max-width: 70vw;
    border:none;
    padding:20px;
    margin:10px;
    background:transparent;
    font-size:40px;
    color:#fff;
    text-align:right;
  }
  #inputbox::placeholder { color:#fff; }
  #inputbox:focus { outline:none; }
  button {
    padding:5px;
    margin:10px;
    height:60px;
    width:60px;
    font-size:22px;
    border:none;
    border-radius:50%;
    background: linear-gradient(145deg, var(--btn-dark), var(--btn-light));
    box-shadow:11px 11px 22px #0a0a0a, -11px -11px 22px #2a2a2a;
    color:#fff;
    cursor:pointer;
    transition: background .4s ease;
  }
  .btncolor {
    background: var(--accent);
    box-shadow:5px 5px 8px var(--shadow-dark), -3px -3px 9px var(--accent-glow);
    color:#000;
    transition: background .4s ease, box-shadow .4s ease;
  }
  .btncolor1, .backspace { color: var(--accent); font-size:23px; }
  button:active {
    transform: scale(.9) translateY(-10%);
    transition: all .2s ease-in-out;
    background: rgba(0,0,139,0.436);
  }
  footer {
    text-align:center;
    color: var(--accent);
    margin-top:8px;
    font-size:13px;
  }
</style>
</head>
<body>
  <div class="container" style="position:relative;">
    <button class="theme-toggle" id="themeBtn" title="Mode: ✦ Midnight">✦</button>
    <div class="row"><input type="text" id="inputbox" placeholder="0" readonly=""></div>
    <div class="row">
      <button class="btncolor" data-action="clear">AC</button>
      <button class="backspace" data-action="back">⌫</button>
      <button class="btncolor1" data-value="%">%</button>
      <button class="btncolor1" data-value="/">/</button>
    </div>
    <div class="row">
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
      <button class="btncolor1" data-value="*">*</button>
    </div>
    <div class="row">
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
      <button class="btncolor1" data-value="-">-</button>
    </div>
    <div class="row">
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
      <button class="btncolor1" data-value="+">+</button>
    </div>
    <div class="row">
      <button data-value="00">00</button><button data-value="0">0</button><button data-value=".">.</button>
      <button class="btncolor" data-action="equals">=</button>
    </div>
    <footer>Created © by Vinay</footer>
  </div>

<script>
  const input = document.getElementById('inputbox');
  const themeBtn = document.getElementById('themeBtn');
  let expr = '';

  const themes = ['default', 'gold', 'mono'];
  const themeLabels = { default: '✦ Neon', gold: '✦ Gold Luxe', mono: '✦ Midnight' };
  let themeIndex = 0;
  try {
    const saved = localStorage.getItem('calc-theme');
    if (saved && themes.includes(saved)) themeIndex = themes.indexOf(saved);
  } catch {}

  function applyTheme() {
    const t = themes[themeIndex];
    if (t === 'default') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = '✦';
    themeBtn.title = 'Mode: ' + themeLabels[t];
    try { localStorage.setItem('calc-theme', t); } catch {}
  }
  applyTheme();

  themeBtn.addEventListener('click', () => {
    themeIndex = (themeIndex + 1) % themes.length;
    applyTheme();
  });

  function render() {
    input.value = expr || '';
  }

  function safeEval(str) {
    // Only allow digits, operators, parentheses, decimal points and %
    if (!/^[0-9+\-*/.%\s]+$/.test(str)) throw new Error('Invalid characters');
    // Convert a trailing/standalone % into division by 100 for simple percentage use
    const converted = str.replace(/(\d+(\.\d+)?)%/g, '($1/100)');
    // eslint-disable-next-line no-new-func
    return Function('"use strict"; return (' + converted + ')')();
  }

  document.querySelectorAll('button[data-action], button[data-value]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const value = btn.dataset.value;

      if (action === 'clear') {
        expr = '';
      } else if (action === 'back') {
        expr = expr.slice(0, -1);
      } else if (action === 'equals') {
        try {
          const result = safeEval(expr);
          expr = (result === undefined || Number.isNaN(result) || !Number.isFinite(result))
            ? 'Error' : String(result);
        } catch {
          expr = 'Error';
        }
      } else if (value === '.') {
        // Prevent a second decimal point in the current number segment
        const lastSegment = expr.split(/[+\-*/]/).pop();
        if (!lastSegment.includes('.')) expr += '.';
      } else if (value !== undefined) {
        expr = (expr === 'Error' ? '' : expr) + value;
      }
      render();
    });
  });

  document.addEventListener('keydown', (e) => {
    if (/^[0-9+\-*/.%]$/.test(e.key)) { expr += e.key; render(); }
    else if (e.key === 'Enter') { document.querySelector('[data-action="equals"]').click(); }
    else if (e.key === 'Backspace') { expr = expr.slice(0, -1); render(); }
    else if (e.key === 'Escape') { expr = ''; render(); }
  });
</script>
